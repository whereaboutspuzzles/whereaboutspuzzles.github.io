<script>
// AL-072 (scripts/site/case-files.ts): a profile link's ?utm_source= rides along to this site's next pages and
// forwarders, so the counter can follow each platform's visitors step by step; a NEW stamp or a season's line goes
// once its day (data-until) has come. It reads this page's own address and today's date only; nothing is stored or sent.
(function () {
  var s = new URLSearchParams(location.search).get('utm_source');
  if (s) document.querySelectorAll('a[href^="/"]').forEach(function (a) {
    var u = new URL(a.getAttribute('href'), location.origin);
    if (/\.\w+$/.test(u.pathname) || /^\/(impressum|datenschutz)\//.test(u.pathname)) return;
    u.searchParams.set('utm_source', s);
    a.setAttribute('href', u.pathname + u.search + u.hash);
  });
  var today = new Date().toISOString().slice(0, 10);
  document.querySelectorAll('[data-until]').forEach(function (el) {
    if (today >= el.getAttribute('data-until')) el.parentNode.removeChild(el);
  });
})();
</script>
